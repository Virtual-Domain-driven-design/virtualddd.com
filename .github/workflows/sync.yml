# Pull content from Notion, and deploy if anything actually changed.
#
# Two triggers, deliberately:
#
#   repository_dispatch  n8n fires this the moment a session is published, and
#                        every hour on its own clock for ordinary edits. The
#                        hourly one is the part that matters: the `schedule:`
#                        below asks for :25 and GitHub actually fires it two to
#                        three hours apart, which is a guest bio sitting
#                        unpublished all afternoon. n8n's timer keeps time.
#
#   schedule             the nightly full sync, and a backstop for the hourly
#                        one. `--full` ignores the incremental state and
#                        re-pulls the ddd-crew repositories, so any drift — a
#                        missed dispatch, an upstream README — heals within a
#                        day. GitHub being hours late with *that* costs nothing,
#                        which is why it stays here while the hourly clock moved
#                        to n8n.
#
# Nothing is deployed unless the sync produced a diff, so the two clocks
# overlapping costs a minute of CI and nothing else.
name: Sync from Notion

on:
  repository_dispatch:
    types: [content-published, content-edited]
  schedule:
    # Ordinary edits ride the clock, and nothing watches for them, which is why
    # there is no debouncing anywhere: an hour in which nobody edits costs one
    # minute of CI and deploys nothing.
    #
    # The hourly one here is the backstop now, not the clock. GitHub delays and
    # drops scheduled runs on a repository that is mostly quiet: across one day
    # these fired at 00:53, 04:37, 06:02, 07:57, 10:55 and 13:07, never at :25.
    # No cron expression fixes that, so the VirtualDDD hourly sync workflow in
    # n8n keeps the hour. Leave this here anyway — it costs nothing, and it is
    # what still publishes the site on a day n8n is switched off.
    - cron: '25 * * * *'   # hourly, for edits — backstop; n8n keeps this hour
    - cron: '17 3 * * *'   # nightly, --full, for drift
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every page, ignoring the incremental state
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      summary: ${{ steps.diff.outputs.summary }}
      # The commit this run made. The deploy has to be told, or it builds the
      # site as it stood before the sync — see the `ref` input in deploy.yml.
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every other secret in this repository degrades to "skip and say so" —
      # deploy.yml guards on `[ -z "$HOST" ]`. This one did not: an empty or
      # rotated `NOTION_TOKEN` makes the sync script exit 1, on a schedule,
      # hourly, with nothing actually wrong. A red run that means "not
      # configured" is indistinguishable from a red run that means "broken",
      # and teaches everyone to ignore both.
      #
      # Skipping the *job* rather than the step, because everything after this
      # point — the diff, the commit, the deploy it triggers — only means
      # anything if something was fetched.
      - name: Is there anything to sync from?
        id: token
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped"
              echo
              echo "No \`NOTION_TOKEN\` secret is set, so there is nothing to sync from."
              echo "Add it at **Settings → Secrets and variables → Actions**, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Notion and ddd-crew
        if: steps.token.outputs.ready == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Raises GitHub's 60/hour unauthenticated limit, which CI runners
          # share across tenants and would otherwise hit at random.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ (github.event.schedule == '17 3 * * *' || inputs.full) && '--full' || '' }}
        # This list must match `sync:notion` in package.json. It is not that
        # script because only the content collections take --full, and adding a
        # collection here and forgetting there (or the other way round) is a
        # collection that silently never updates: conferences shipped that way
        # and would have frozen at whatever was first committed.
        run: |
          npx tsx scripts/sync-notion.ts guests --write
          for c in sessions open-spaces stories heuristics reading-list; do
            npx tsx scripts/sync-notion.ts content --collection=$c --write $FULL
          done
          for r in organisers conferences; do
            npx tsx scripts/sync-notion.ts $r --write
          done
          # Which ddd-crew repos the site carries, and in what order. One query,
          # so it runs every time: ticking a row in Notion is live within the
          # hour, and fetching the READMEs below is the expensive half.
          npx tsx scripts/sync-notion.ts ddd-crew --write
          # Someone else's repositories, so there is nothing to be incremental
          # about. The nightly --full re-pulls them for upstream drift; any other
          # run does it only when the list above actually changed, so a tool
          # added this morning does not wait for the night.
          if [ -n "$FULL" ] || ! git diff --quiet -- data/ddd-crew.json; then
            npx tsx scripts/sync-ddd-crew.ts --write
          fi
          npm run redirects

      - name: What changed?
        id: diff
        # Guarded too, or a skipped sync reports "nothing changed in Notion",
        # which is a different claim from \"we never looked\".
        if: steps.token.outputs.ready == 'true'
        run: |
          # Stage first, and ask the index rather than the working tree.
          # `git diff` cannot see a file git has never heard of, and that is
          # every file of a collection the *first* time it syncs. Conferences
          # wrote four entries and four logos into a directory that had never
          # existed, and this step reported nothing to do: no commit, no deploy,
          # a green run and an empty section on the site. Every other collection
          # was committed by hand during the migration, so none of them ever hit
          # it. `git add -A` is what the commit step does anyway; doing it here
          # means the thing we test is the thing we would commit.
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed in Notion since the last sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Content changes"
            echo
            git diff --cached --name-status -- src/content data/retired-urls.csv | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          # A one-line summary for the Discord post, e.g. "3 changed, 1 new".
          added=$(git diff --cached --diff-filter=A --name-only -- src/content | wc -l)
          modified=$(git diff --cached --diff-filter=M --name-only -- src/content | wc -l)
          removed=$(git diff --cached --diff-filter=D --name-only -- src/content | wc -l)
          echo "summary=${added} new, ${modified} updated, ${removed} removed" >> "$GITHUB_OUTPUT"

      # Two things the sync can see but must not decide: an address still being
      # served after its page stopped being published, and a page Notion calls
      # published that has no slug and so no address at all. Neither is worth
      # failing a run over, and both are invisible if they only reach a CI log.
      #
      # Before the commit, so HEAD is still the previous run and the file's own
      # diff is the whole test: the same alert is only ever raised once.
      - name: Anything only a person can decide?
        if: steps.diff.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.N8N_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HOOK" ] || { echo "No webhook configured, so nobody was told."; exit 0; }
          [ -f data/sync-alerts.json ] || { echo "Nothing to raise."; exit 0; }
          # The whole test below is this file's own diff, so it has to be a file
          # git will talk about. It spent a while in .gitignore, where
          # --porcelain says nothing about it however much it changed, and every
          # alert since the pipeline was built was answered with "already
          # raised" — including eight organiser photos that had never been
          # raised at all. Tripwire rather than a comment, because the failure
          # is silent and looks exactly like having nothing to say.
          if git check-ignore -q data/sync-alerts.json; then
            echo "::error::data/sync-alerts.json is gitignored, so no alert can ever be raised."
            exit 1
          fi
          # --porcelain rather than `git diff`, which cannot see a file that has
          # never been committed — the very first alert is exactly that case.
          [ -n "$(git status --porcelain -- data/sync-alerts.json)" ] \
            || { echo "The same as last time; already raised."; exit 0; }
          items=$(jq -c '.items // []' data/sync-alerts.json)
          [ "$items" = "[]" ] && { echo "Everything outstanding has been resolved."; exit 0; }
          code=$(jq -n --argjson items "$items" --arg run "$RUN" \
            '{event:"sync-alerts", items:$items, run:$run}' \
            | curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H 'Content-Type: application/json' \
                -H "X-VirtualDDD-Token: $TOKEN" \
                -d @- "$HOOK")
          # Never fails the run. These alerts are editorial, and publishing must
          # not be held hostage to a chat webhook — but an alert that silently
          # went nowhere is worse than no alert, so it is said out loud.
          case "$code" in
            2*) echo "Raised with the organisers ($code)." ;;
            403) echo "::warning::n8n rejected the alert (403). Is N8N_WEBHOOK_TOKEN set, and does it match the Header Auth credential in n8n?" ;;
            *)   echo "::warning::n8n answered $code; these alerts reached nobody:"; echo "$items" | jq -r '.[] | "  " + .kind + ": " + .title' ;;
          esac

      - name: Commit
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "virtualddd-sync"
          git config user.email "noreply@virtualddd.com"
          git add -A
          git commit -m "Content: ${{ steps.diff.outputs.summary }}" \
                     -m "Synced from Notion by ${{ github.event_name }}."
          # A sync takes a couple of minutes, and anything landing on main in
          # that window makes this push a non-fast-forward. Twice on
          # 2026-07-29: the run went red, its content was thrown away, and the
          # only thing that recovered it was the next sync happening to run.
          # Rebasing is safe here because these are whole-file rewrites of
          # generated content, and a human editing src/content is refused by
          # the deploy anyway.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::main moved three times while this sync was working; nothing pushed."
              exit 1
            fi
            echo "main moved while this run was working; rebasing and retrying"
            git pull --rebase origin main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      changes: ${{ needs.sync.outputs.summary }}
      ref: ${{ needs.sync.outputs.sha }}
