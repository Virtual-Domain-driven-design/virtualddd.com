# Rebuild when Bluesky has something the home page does not.
#
# The feed on the home page is fetched at build time (src/pages/index.astro),
# which makes it exactly as fresh as the last deploy — and a deploy happens when
# Notion changes or somebody pushes, neither of which has anything to do with
# posting on Bluesky. A quiet week in Notion is a stale panel on the page
# everyone lands on.
#
# So: ask Bluesky what the newest post is, ask the live site whether it is
# showing it, and deploy only if it is not. Which is the same rule the sync
# lives by — nothing deploys unless something actually changed — and it matters
# here for a concrete reason: the host keeps five releases, so an unconditional
# daily rebuild would spend the whole rollback history on days when nothing
# happened.
#
# It repairs a second failure too, and this is the one nobody would notice. If
# Bluesky is slow or down *during* a build, that build ships a home page with no
# feed at all and a warning in a log nobody reads. The check below then finds
# the newest post missing from the page and rebuilds, without anyone asking.
name: Refresh the Bluesky feed

on:
  schedule:
    - cron: '20 6 * * *' # daily, before the day starts in Europe
  workflow_dispatch:

# Only to dispatch the deploy. Nothing here reads or writes the repository.
permissions:
  actions: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is the home page showing the newest post?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: ${{ secrets.SITE_URL }}
          HANDLE: virtualddd.com
        run: |
          set -euo pipefail
          # Strip a trailing slash before appending one. The secret carries one,
          # which made the request `//` — Apache answers that with a redirect,
          # and a redirect body has no posts in it, so the check concluded the
          # page was stale every single time and would have rebuilt daily.
          # `verify-live.mjs` has done the same `replace(/\/$/, '')` since launch,
          # which is the hint this should have taken from the start.
          SITE="${SITE:-https://virtualddd.com}"
          SITE="${SITE%/}"

          feed=$(curl -sS --max-time 20 \
            "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=$HANDLE&limit=1&filter=posts_no_replies" \
            || true)

          # No answer is not a reason to rebuild. Bluesky being unreachable from
          # this runner says nothing about the site, and rebuilding on it would
          # bake in whatever the build's own fetch got — possibly nothing.
          #
          # The `|| true` is the same guard as the count below, one check
          # earlier. curl's own failure is already handled, so an empty `$feed`
          # leaves jq quiet and this branch is taken. A body that is not JSON at
          # all is the gap: a proxy's 502 page, a challenge, anything Bluesky
          # did not write. jq exits 2 on it, `pipefail` carries that out of the
          # pipe, and `set -e` kills the step one line above the warning written
          # for exactly this case. The parse error still reaches stderr, where
          # it is diagnosable; what changes is that the check lives long enough
          # to take its own false branch.
          newest=$(printf '%s' "$feed" | jq -r '.feed[0].post.uri // empty' | awk -F/ '{print $NF}' || true)
          if [ -z "$newest" ]; then
            echo "::warning::Bluesky did not answer, or has no posts. Nothing to compare, so nothing to do."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -L because the apex may redirect, and a redirect body contains no
          # posts. Counting what was found makes a wrong answer diagnosable
          # instead of just wrong: zero posts means the page was not fetched.
          #
          # The `|| true` is what makes that count reachable at all. `grep` exits
          # 1 when it matches nothing, `pipefail` carries that out of the pipe,
          # `set -e` reads a failed assignment and kills the step three lines
          # above the warning written for exactly this case. So the one run that
          # most needed to say why it was unhappy was the one run that could not:
          # 2026-08-21 and 2026-08-26 both ended with no output at all and exit
          # 1, each after a host hiccup served something small instead of the
          # home page. `grep -c` is not the fix; it counts matching lines, and
          # the feed panel's markup puts more than one post on a line.
          page=$(curl -sSL --max-time 25 "$SITE/")
          found=$(printf '%s' "$page" | { grep -oE '/post/[a-z0-9]+' || true; } | wc -l)
          echo "Newest on Bluesky: \`$newest\`. Posts on the home page: $found." >> "$GITHUB_STEP_SUMMARY"

          if [ "$found" -eq 0 ]; then
            echo "::warning::Fetched $SITE/ and found no posts at all — the feed panel is missing, or the page did not load."
          fi

          # A here-string rather than a pipe, and this is not a style choice.
          # `grep -q` stops at the first match, and `$newest` sits about 42KB
          # into a 135KB page, so `printf` was still writing when the pipe shut:
          # SIGPIPE, status 141, and `pipefail` handed that to the `if` as a
          # failure. Which read as "the page is not showing it" on every run
          # where it *was* showing it, so `rebuild=false` had never once been
          # taken and deploy.yml was dispatched at 07:0x daily. That is the
          # unconditional daily rebuild the top of this file exists to avoid,
          # spending the host's five-release rollback history every five days.
          # The trailing-slash fix above was aimed at the same symptom and could
          # not have cured it: the cause was never in the URL.
          #
          # -F because an rkey is a literal, not a pattern.
          if grep -qF "$newest" <<<"$page"; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "The home page is already showing it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Rebuilding"
              echo
              echo "Bluesky's newest post is \`$newest\`, and the home page is not showing it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # deploy.yml builds from the current main, which is the same content the
      # last deploy shipped — only the feed differs. No `ref` input, so it uses
      # the tip, which is what we want.
      - name: Rebuild
        if: steps.check.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field changes="a new post on Bluesky"
          echo "Asked deploy.yml to rebuild."
