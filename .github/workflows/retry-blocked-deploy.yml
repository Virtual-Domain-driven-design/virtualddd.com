# Run a blocked deploy again, on a runner the host has not locked out.
#
# Kualo's brute-force protection (cPHulk) blocks IPs, and a GitHub runner draws
# its IP from a pool shared with everyone else on Azure. So a deploy can be
# refused for something another tenant did, and the *same commit* on the next
# runner goes straight through. On 2026-08-10 two consecutive syncs were
# refused twenty minutes apart, and a manual re-run of the second one deployed
# it without a single change to anything.
#
# That is worth automating because a failed deploy does not heal on its own.
# Nothing deploys unless the sync produced a diff, and by the time the deploy
# fails the content is already committed, so every later sync correctly decides
# there is nothing to publish. The site then stays stale until somebody reads
# Discord, or until an unrelated edit happens to carry it. Both blocked runs
# that afternoon left content committed and unpublished, and it stayed that way
# until a person intervened.
#
# **Only the lockout, and only once.** This is a retry for a failure that is
# known to be about which runner drew which IP. Every other way a deploy can
# fail is deterministic, and running it again would only waste three minutes
# and blur the signal in Discord.
name: Retry a deploy the host locked out

on:
  workflow_run:
    # Every workflow that can reach the deploy. `deploy.yml` is *called* by the
    # two below rather than triggered, and a called workflow raises no
    # workflow_run event of its own: the event belongs to the caller. Listening
    # only for 'Deploy' would have caught neither of the failures this exists
    # for, because both of them came from a sync.
    #
    # `refresh-feed.yml` needs no entry: it dispatches `deploy.yml` rather than
    # calling it, so its rebuild is a Deploy run in its own right.
    workflows: ['Deploy', 'Sync from Notion', 'Merge routine dependency updates']
    types: [completed]

# Enough to read why a run failed and to press the button again. No SSH key and
# no `contents` at all: `deploy.yml` stays the only thing holding a key, and it
# stays read-only. Splitting the two is the whole reason this is a second file
# rather than a step at the bottom of the deploy.
permissions:
  actions: write
  checks: read

jobs:
  retry:
    # `run_attempt` is GitHub's own counter, so nothing has to be remembered
    # anywhere: a re-run arrives back at this same trigger as attempt 2 and is
    # refused here. One retry, and then the run stays red and a person is told.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Was it the host, or was it us?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "$TRIGGER run $RUN_ID failed; deciding whether it is worth another runner."

          # The job that ran the deploy, whether it was called or triggered.
          # Asked for by the step that failed rather than by job name, because
          # the name differs between the two paths: `deploy` when called,
          # `deploy / deploy` when it is a workflow of its own.
          job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
                  --jq '[.jobs[] | select(any(.steps[]; .name == "Deploy" and .conclusion == "failure"))][0].id // empty')
          if [ -z "$job" ]; then
            echo "Nothing failed at the Deploy step, so this is not ours: the build, the"
            echo "suite and the content guard all fail for reasons a new runner cannot fix."
            exit 0
          fi

          # Read the annotation, never the log.
          #
          # The step prints its own script before running it, so the log of
          # *every* deploy that reaches this point contains the literal line
          #   echo "::error::Cannot reach the host on port $PORT from this runner."
          # whether it was blocked or not. Grepping the log for that sentence
          # looked right and was tested green against both real lockouts, then
          # matched a July failure that was an SSH auth error (exit 255), and
          # would have retried every deterministic misconfiguration there is.
          # This endpoint returns only what was actually raised.
          #
          # Annotations are written as the job finishes and this trigger can be
          # quicker than they are, so ask a few times. Not finding one is the
          # safe answer and costs only what today already costs: no retry, the
          # run stays red, and Discord has already been told by deploy.yml.
          msg=""
          for _ in 1 2 3 4 5; do
            msg=$(gh api "repos/$REPO/check-runs/$job/annotations" \
                    --jq '[.[] | select(.annotation_level == "failure") | .message] | join(" ")' 2>/dev/null || true)
            [ -n "$msg" ] && break
            sleep 5
          done

          case "$msg" in
            *"Cannot reach the host on port"*) ;;
            *)
              echo "The Deploy step failed, but not on the reachability probe:"
              echo "  ${msg:-no annotation could be read}"
              echo "Another runner would fail the same way, so it is left alone."
              exit 0
              ;;
          esac

          # `--failed` rather than a fresh dispatch, for the reason `ref` exists
          # in deploy.yml at all. It re-runs only the failed job, on a new runner
          # with a new IP, and keeps the run's inputs: the sha the sync passed is
          # still the sha it committed, and the successful sync job's outputs are
          # preserved rather than recomputed. A dispatch would have to rebuild
          # that input, and rebuilding it wrongly is how the site once shipped
          # the commit before the one it was publishing.
          gh run rerun "$RUN_ID" --failed --repo "$REPO"

          {
            echo "### The host refused the runner, so the deploy is running again"
            echo
            echo "Kualo's cPHulk blocks by IP, and a runner's IP is shared with the rest"
            echo "of Azure, so this usually clears on a different one. Nothing was changed:"
            echo "the same commit is being built by the same run, as attempt 2."
            echo
            echo "If that one is refused too the run stays red and nothing else will try,"
            echo "which means the block is wider than one address. See AGENTS.md."
          } >> "$GITHUB_STEP_SUMMARY"
