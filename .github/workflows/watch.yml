# Ask the live site, once a week, whether it is still keeping its promises.
#
# Every deploy already samples the redirect map, and the blocking suite proves
# the *build* is right. Neither can see the two things that rot on their own,
# without anybody touching this repository:
#
#   - the URL contract, all 967 addresses, against real Apache. A host config
#     change, an .htaccess lost to a restore, a docroot pointed somewhere new —
#     none of those are a commit, so none of them fail a build.
#   - the certificate. It is a wildcard, so it renews over DNS rather than the
#     challenge directory this repo ships, which means renewal is somebody
#     else's automation and its failure mode is silence until the day it
#     expires.
#
# Weekly rather than daily on purpose: 967 requests is a real load to put on a
# shared host, and neither failure is one you would fix within the hour.
name: Watch the live site

on:
  schedule:
    - cron: '40 6 * * 1'   # Mondays, early, so there is a week to act
  workflow_dispatch:

# Read-only: this job asks the live site questions and writes nothing here.
permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # No `npm ci`: verify-live.mjs reads data/live-urls.txt and calls fetch,
      # both of which node has already.
      - name: Is every inherited address still answered?
        id: urls
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          [ -n "$SITE_URL" ] || { echo "No SITE_URL secret, so there is nothing to check."; exit 0; }
          if node scripts/verify-live.mjs "$SITE_URL" --all > urls.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat urls.log
          cat urls.log >> "$GITHUB_STEP_SUMMARY"

      - name: How long has the certificate got?
        id: cert
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          [ -n "$SITE_URL" ] || exit 0
          host=$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*##')
          end=$(echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate for $host expires in $days days ($end)." >> "$GITHUB_STEP_SUMMARY"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "expires=$end" >> "$GITHUB_OUTPUT"

      # Red, and only red. A failed scheduled run emails the account that last
      # changed this workflow, straight from GitHub — which is the point: the
      # Discord line that used to be here travelled through n8n and a webhook,
      # the same kind of chain it was watching, and an alert that quietly went
      # nowhere is the failure this repository keeps finding.
      #
      # Nothing is said when all is well. A weekly "still fine" is a message
      # people learn to skip, and the run itself is the record.
      - name: Fail the run if the site is not keeping its promises
        if: always()
        run: |
          bad=0
          if [ "${{ steps.urls.outputs.ok }}" = "false" ]; then
            echo "::error::The deployed site no longer answers every address it promises. See the summary."
            bad=1
          fi
          days=${{ steps.cert.outputs.days || 0 }}
          # AutoSSL renews with about a month to go. Three weeks out it has not
          # renewed, and that is a conversation with the host rather than
          # something to keep watching. This was fourteen days while a separate
          # Discord notice fired at twenty-one; with that notice gone the run
          # itself has to be the thing that speaks up in time.
          if [ "$days" -gt 0 ] && [ "$days" -lt 21 ]; then
            echo "::error::The certificate expires in $days days and has not been renewed."
            bad=1
          fi
          exit $bad
